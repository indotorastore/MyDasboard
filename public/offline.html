<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#4f46e5">
    <title>Offline — Ruangku</title>
    <style>
      * { box-sizing: border-box; }
      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        place-items: center;
        background: #f6f7fb;
        color: #0f172a;
        font-family: Arial, sans-serif;
      }
      main {
        width: min(100%, 420px);
        padding: 32px;
        border: 1px solid #e2e8f0;
        border-radius: 24px;
        background: #fff;
        text-align: center;
        box-shadow: 0 20px 50px rgb(15 23 42 / 8%);
      }
      img { width: 56px; height: 56px; border-radius: 50%; }
      h1 { margin: 20px 0 8px; font-size: 22px; }
      p { margin: 0; color: #64748b; font-size: 14px; line-height: 1.6; }
      button {
        margin-top: 24px;
        padding: 12px 20px;
        border: 0;
        border-radius: 12px;
        background: #4f46e5;
        color: white;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/ruangku-logo.png" alt="">
      <h1>Kamu sedang offline</h1>
      <p>Ruangku membutuhkan koneksi internet untuk memuat akun dan data terbaru. Periksa koneksi, lalu coba kembali.</p>
      <button type="button" onclick="location.reload()">Coba lagi</button>
    </main>
  </body>
</html>
